name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags, for the frozen-profile guard
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Unit and fixture tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Lint fixtures
        run: python scripts/lint_fixtures.py
      - name: Conformance profiles match the registry
        run: python scripts/conformance.py --check
      - name: Released conformance profiles are unchanged
        run: python scripts/check_frozen.py
      - name: Upstream tracking dry run
        run: >
          python scripts/track_upstream.py --dry-run
          --releases-file tests/fixtures/upstream/releases.json
          --changelog-dir tests/fixtures/upstream
          --issues-file tests/fixtures/upstream/issues.json

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Ruff
        run: |
          uvx ruff@0.17.3 check src tests scripts
          uvx ruff@0.17.3 format --check src tests scripts
      - name: upstream.json matches its schema
        run: uvx check-jsonschema@0.39.0 --schemafile upstream.schema.json upstream.json
      - name: Build the package
        run: uv build

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # gitleaks lists the PR's commits
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
