name: Track MCP upstream

# Daily: compare upstream MCP releases (including RC tags) with upstream.json.
# Opens or updates one "Track MCP <rev>" issue per new revision, labeled
# mcp-upstream. Never edits the repo or merges anything. The label starts the
# agent in docs/upstream-agent.md. See docs/versioning.md.

on:
  schedule:
    - cron: "17 6 * * *" # daily 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# One run at a time, so a scheduled and a manual run cannot both open or relabel an issue.
concurrency:
  group: track-upstream
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Compare upstream releases with upstream.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/track_upstream.py
