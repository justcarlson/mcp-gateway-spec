[project]
name = "mcp-gateway-check"
version = "0.1.0"
description = "Conformance checker for mcp-gateway-spec: lint MCP gateway tool surfaces."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = []
keywords = ["mcp", "model-context-protocol", "mcp-gateway", "linter", "ai-agents"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Environment :: Console",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/justcarlson/mcp-gateway-spec"
Specification = "https://github.com/justcarlson/mcp-gateway-spec/blob/main/SPEC.md"
Changelog = "https://github.com/justcarlson/mcp-gateway-spec/blob/main/CHANGELOG.md"

[project.scripts]
mcp-gateway-check = "mcp_gateway_check.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_gateway_check"]

[tool.hatch.build.targets.wheel.force-include]
"upstream.json" = "mcp_gateway_check/upstream.json"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
